<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的卡包 · Points Hunter NA</title>
  <meta name="description" content="选择你持有的信用卡，一键生成专属消费攒点对比表。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222f;
      --border: #2e2e3e;
      --accent: #7c6ef7;
      --accent2: #f7c26e;
      --green: #4ade80;
      --text: #e8e8f0;
      --muted: #888899;
      --tag-bg: #2a2a3a;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* NAV */
    nav {
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      background: rgba(15,15,19,0.92);
      backdrop-filter: blur(12px);
      z-index: 100;
    }
    .nav-brand {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-brand span { color: var(--accent); }
    .nav-right { display: flex; align-items: center; gap: 12px; }

    /* LANG TOGGLE */
    .lang-toggle {
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 3px;
    }
    .lang-btn {
      padding: 4px 16px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      transition: all 0.18s ease;
      cursor: pointer;
      user-select: none;
    }
    .lang-btn.active { background: var(--accent); color: #fff; }

    /* AUTH BTN */
    .btn {
      padding: 8px 20px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #6a5de0; }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm { padding: 5px 14px; font-size: 0.78rem; }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--border); }
    .btn-danger:hover { border-color: var(--danger); }

    /* USER AVATAR */
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* HERO / GATE */
    .gate {
      max-width: 480px;
      margin: 6rem auto;
      text-align: center;
      padding: 0 1.5rem;
    }
    .gate-icon { font-size: 3.5rem; margin-bottom: 1.2rem; }
    .gate h2 { font-size: 1.7rem; font-weight: 700; margin-bottom: 0.8rem; }
    .gate p { color: var(--muted); margin-bottom: 2rem; line-height: 1.7; }
    .gate .btn { margin: 0 auto; justify-content: center; width: fit-content; }
    .google-icon {
      width: 18px; height: 18px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #333;
      font-weight: 700;
    }

    /* MAIN LAYOUT */
    .page { max-width: 1200px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 2.5rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .page-header h1 { font-size: 1.5rem; font-weight: 700; }
    .page-header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

    /* TABS */
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    .tab {
      padding: 10px 20px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.18s;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:hover:not(.active) { color: var(--text); }

    /* CARD SELECTOR */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .cc-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 1.2rem;
      cursor: pointer;
      transition: all 0.18s;
      position: relative;
      user-select: none;
    }
    .cc-card:hover { border-color: var(--accent); }
    .cc-card.selected {
      border-color: var(--accent);
      background: rgba(124,110,247,0.08);
    }
    .cc-card .check {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: all 0.18s;
    }
    .cc-card.selected .check {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .cc-issuer {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .cc-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 6px; }
    .cc-points {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--accent2);
      font-weight: 600;
    }
    .cc-bonus-label {
      font-size: 0.72rem;
      color: var(--muted);
      background: var(--tag-bg);
      padding: 2px 8px;
      border-radius: 99px;
    }
    .cc-annual {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 6px;
    }

    /* COMPARISON TABLE */
    .table-wrap {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    thead {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }
    th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
    }
    th.card-col {
      color: var(--text);
      font-size: 0.85rem;
      min-width: 140px;
    }
    th.cat-col { min-width: 150px; }
    td {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .cat-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
    }
    .cat-icon { font-size: 1.1rem; }
    .multiplier {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 56px;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      background: var(--tag-bg);
      color: var(--muted);
    }
    .multiplier.best {
      background: rgba(124,110,247,0.2);
      color: var(--accent);
      border: 1px solid rgba(124,110,247,0.4);
    }
    .multiplier.great {
      background: rgba(74,222,128,0.12);
      color: var(--green);
      border: 1px solid rgba(74,222,128,0.25);
    }
    .points-label {
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--muted);
      display: block;
      text-align: center;
    }
    .best-badge {
      font-size: 0.65rem;
      background: var(--accent);
      color: white;
      padding: 1px 6px;
      border-radius: 99px;
      font-weight: 700;
      display: block;
      text-align: center;
      margin-top: 2px;
    }

    /* TOOLTIP */
    .rate-note {
      display: inline-block;
      margin-left: 3px;
      font-size: 0.65rem;
      color: var(--accent2);
      cursor: default;
      position: relative;
      vertical-align: middle;
    }
    .rate-note .tip {
      visibility: hidden;
      opacity: 0;
      background: #2a2a3f;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.75rem;
      line-height: 1.5;
      padding: 6px 10px;
      border-radius: 8px;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      z-index: 200;
      transition: opacity 0.15s;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .rate-note:hover .tip {
      visibility: visible;
      opacity: 1;
    }

    /* EMPTY STATE */
    .empty {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty h3 { font-size: 1.1rem; color: var(--text); margin-bottom: 0.5rem; }

    /* LEGEND */
    .legend {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .legend-dot {
      width: 28px;
      height: 20px;
      border-radius: 5px;
      font-size: 0.7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* NOTICE */
    .notice {
      background: rgba(247,194,110,0.08);
      border: 1px solid rgba(247,194,110,0.2);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
      display: flex;
      gap: 8px;
    }

    /* SELECTED COUNT */
    .selected-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 8px;
    }
    .selected-count {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .selected-count strong { color: var(--accent); }

    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.82rem;
    }

    /* LOGIN SECTION */
    #login-section, #app-section { }
    .hidden { display: none !important; }

    @media (max-width: 640px) {
      .page { padding: 1.5rem 1rem 4rem; }
      .page-header { flex-direction: column; }
    }
  </style>
</head>

</div>

<!-- APP -->
<div id="app-section" class="hidden">
  <div class="page">
    <div class="page-header">
      <div>
        <h1>我的卡包 💳</h1>
        <p id="page-sub">选择你持有的卡，查看专属攒点对比</p>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('select')">选择持卡</div>
      <div class="tab" onclick="switchTab('compare')">消费对比表</div>
    </div>

    <!-- TAB: SELECT -->
    <div id="tab-select">
      <div class="selected-info">
        <div class="selected-count">已选 <strong id="sel-count">0</strong> 张</div>
        <button class="btn btn-outline btn-sm" onclick="clearAll()">清空选择</button>
      </div>
      <div class="card-grid" id="card-grid">
        <!-- filled by JS -->
      </div>
      <div style="text-align:center; margin-top:1rem;">
        <button class="btn btn-primary" onclick="switchTab('compare')" id="compare-btn">
          查看对比表 →
        </button>
      </div>
    </div>

    <!-- TAB: COMPARE -->
    <div id="tab-compare" class="hidden">
      <div class="notice">
        ⚡ 紫色 = 最高等效倍率 &nbsp;|&nbsp; 绿色 = 不错选择 &nbsp;|&nbsp; 灰色 = 基础倍率。Marriott ×0.7、Hilton ×0.4 估值加权，数据仅供参考。
      </div>
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:1.2rem; flex-wrap:wrap;">
        <button class="btn btn-outline" id="overseas-btn" onclick="toggleOverseas()" style="display:flex;align-items:center;gap:8px;">
          🌍 <span id="overseas-label"></span><strong id="overseas-status"></strong>
        </button>
        <span id="overseas-hint" style="font-size:0.8rem;color:var(--muted);"></span>
      </div>
      <div id="compare-content">
        <!-- filled by JS -->
      </div>
    </div>
  </div>
</div>

<footer>
  © 2026 积分猎人在北美 · 数据仅供参考，请以各银行官网为准
</footer>

      await signInWithPopup(auth, provider);

  // ============================================================
  // FIRESTORE: load & save
  // ============================================================
  async function loadUserCards(uid) {
    if (!db) return;
    try {
      const snap = await getDoc(doc(db, 'users', uid));
      if (snap.exists()) {
        const data = snap.data();
        selectedCards = new Set(data.cards || []);
      }
    } catch(e) { console.warn('load failed', e); }
    renderCardGrid();
    renderCompareTable();
  }

  async function saveUserCards(uid) {
    if (!db || !uid) {
      // Guest mode: save to localStorage
      localStorage.setItem('ph-guest-cards', JSON.stringify([...selectedCards]));
      return;
    }
    try {
      await setDoc(doc(db, 'users', uid), { cards: [...selectedCards] }, { merge: true });
    } catch(e) { console.warn('save failed', e); }
  }

  }

  function showApp(user) {
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('app-section').classList.remove('hidden');
    const initial = (user.displayName || user.email || '?')[0].toUpperCase();
    const avatarHtml = user.photoURL ? `<img src="${user.photoURL}" />` : initial;
    document.getElementById('nav-right').innerHTML = `
      <div class="user-info">
        <div class="avatar">${avatarHtml}</div>
        <span>${user.displayName || user.email}</span>
      </div>
      <button class="btn btn-outline btn-sm" onclick="signOutUser()">${t('signOut')}</button>`;
    document.getElementById('page-sub').textContent =
      `${user.displayName || ''} · ${t('pageSub')}`;
    applyStaticStrings();
    renderCardGrid();
    renderCompareTable();
  }

  // ============================================================
  // RENDER: card selector
  // ============================================================
  function renderCardGrid() {
    const grid = document.getElementById('card-grid');
    grid.innerHTML = CARDS.map(c => {
      const sel = selectedCards.has(c.id);
      return `
        <div class="cc-card ${sel ? 'selected' : ''}" onclick="toggleCard('${c.id}')">
          <div class="check">${sel ? '✓' : ''}</div>
          <div class="cc-issuer">${c.issuer}</div>
          <div class="cc-name">${c.name}</div>
          <div class="cc-points">
            <span>✦ ${c.points}</span>
            <span class="cc-bonus-label">${c.annual}</span>
          </div>
        </div>`;
    }).join('');
    const countEl = document.querySelector('.selected-count');
    if (countEl) countEl.innerHTML = t('selectedCount', selectedCards.size);
  }

  window.toggleCard = async (id) => {
    if (selectedCards.has(id)) {
      selectedCards.delete(id);
    } else {
      selectedCards.add(id);
    }
    renderCardGrid();
    renderCompareTable();
    await saveUserCards(currentUser ? currentUser.uid : null);
  };

  window.clearAll = async () => {
    selectedCards.clear();
    renderCardGrid();
    renderCompareTable();
    await saveUserCards(currentUser ? currentUser.uid : null);
  };

  // ============================================================
  // RENDER: comparison table
  // ============================================================
  function getEffectiveRate(card, catId) {
    let rate = card.rates[catId] || 1;
    // Overseas mode: Atmos Summit all categories → 3x
    if (overseasMode && card.id === 'atmos-summit') rate = 3;
    // CPP weighting
    const cpp = card.cpp || 1.0;
    return rate * cpp;
  }

  function formatRate(val) {
    // Show 1 decimal only if not a whole number
    return Number.isInteger(val) ? val.toString() : val.toFixed(1);
  }

  function renderCompareTable() {
    const wrap = document.getElementById('compare-content');
    const selected = CARDS.filter(c => selectedCards.has(c.id));

    if (selected.length === 0) {
      wrap.innerHTML = `
        <div class="empty">
          <div class="empty-icon">💳</div>
          <h3>${t('emptyTitle')}</h3>
          <p style="margin-top:6px;">${t('emptyDesc')}</p>
        </div>`;
      return;
    }

    // Build table
    let html = `<div class="table-wrap"><table>
      <thead>
        <tr>
          <th class="cat-col">${t('catHeader')}</th>
          ${selected.map(c => {
            const hasCpp = c.cpp && c.cpp !== 1.0;
            const cppNote = hasCpp ? `<span style="font-size:0.65rem;color:var(--muted);display:block;font-weight:400;">${t('cppNote', c.cpp)}</span>` : '';
            return `<th class="card-col">${c.issuer}<br/>${c.name}${cppNote}</th>`;
          }).join('')}
        </tr>
      </thead>
      <tbody>`;

    CATEGORIES.forEach(cat => {
      const catLabel = cat[pageLang] || cat.zh;
      const effRates = selected.map(c => getEffectiveRate(c, cat.id));
      const maxRate = Math.max(...effRates);

      html += `<tr>
        <td>
          <div class="cat-cell">
            <span class="cat-icon">${cat.icon}</span>
            <span>${catLabel}</span>
          </div>
        </td>`;

      selected.forEach((c, i) => {
        const rawRate = (overseasMode && c.id === 'atmos-summit') ? 3 : (c.rates[cat.id] || 1);
        const effRate = effRates[i];
        const isBest = effRate === maxRate && effRate > (c.cpp || 1);
        const isGreat = effRate >= maxRate * 0.75 && effRate > (c.cpp || 1) && effRate < maxRate;
        const cls = isBest ? 'best' : isGreat ? 'great' : '';
        const hasCpp = c.cpp && c.cpp !== 1.0;
        const displayVal = hasCpp ? formatRate(effRate) : rawRate;
        const rawLabel = hasCpp ? `<span class="points-label">${t('rawLabel', rawRate)}</span>` : '';
        const noteObj = c.rateNotes && c.rateNotes[cat.id];
        const noteText = noteObj ? (typeof noteObj === 'object' ? (noteObj[pageLang] || noteObj.zh) : noteObj) : null;
        const noteHtml = noteText ? `<span class="rate-note">⚠<span class="tip">${noteText}</span></span>` : '';
        html += `<td>
          <div>
            <span class="multiplier ${cls}">${displayVal}x</span>${noteHtml}
            ${rawLabel}
            <span class="points-label">${c.points}</span>
            ${isBest && selected.length > 1 ? `<span class="best-badge">${t('bestBadge')}</span>` : ''}
          </div>
        </td>`;
      });

      html += `</tr>`;
    });

    html += `</tbody></table></div>`;
    wrap.innerHTML = html;
  }

  // ============================================================
  // OVERSEAS TOGGLE
  // ============================================================
  window.toggleOverseas = () => {
    overseasMode = !overseasMode;
    const btn = document.getElementById('overseas-btn');
    const status = document.getElementById('overseas-status');
    if (status) status.textContent = overseasMode ? t('overseasOn') : t('overseasOff');
    if (btn) {
      btn.style.borderColor = overseasMode ? 'var(--accent)' : '';
      btn.style.color = overseasMode ? 'var(--accent)' : '';
    }
    renderCompareTable();
  };

  // ============================================================
  // LANG
  // ============================================================
  window.setPageLang = (lang) => {
    pageLang = lang;
    localStorage.setItem('ph-lang', lang);
    document.getElementById('page-btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('page-btn-zh').classList.toggle('active', lang === 'zh');
    applyStaticStrings();
    renderCardGrid();
    renderCompareTable();
  };

  function applyStaticStrings() {
    // Page header
    const h1 = document.querySelector('#app-section h1');
    if (h1) h1.textContent = t('pageTitle');
    const sub = document.getElementById('page-sub');
    if (sub) sub.textContent = t('pageSub');
    // Tabs
    const tabs = document.querySelectorAll('.tab');
    if (tabs[0]) tabs[0].textContent = t('tabSelect');
    if (tabs[1]) tabs[1].textContent = t('tabCompare');
    // Clear btn
    const clearBtn = document.querySelector('[onclick="clearAll()"]');
    if (clearBtn) clearBtn.textContent = t('clearAll');
    // Compare btn
    const cmpBtn = document.getElementById('compare-btn');
    if (cmpBtn) cmpBtn.textContent = t('goCompare');
    // Notice
    const notice = document.querySelector('.notice');
    if (notice) notice.textContent = t('notice');
    // Overseas
    const oStatus = document.getElementById('overseas-status');
    if (oStatus) oStatus.textContent = overseasMode ? t('overseasOn') : t('overseasOff');
    const oLabel = document.getElementById('overseas-label');
    if (oLabel) oLabel.textContent = t('overseasLabel');
    const oHint = document.getElementById('overseas-hint');
    if (oHint) oHint.textContent = t('overseasHint');
    // Selected count
    const selCount = document.getElementById('sel-count');
    if (selCount) {
      const countEl = document.querySelector('.selected-count');
      if (countEl) countEl.innerHTML = t('selectedCount', selectedCards.size);
    }
    // Footer
    const footer = document.querySelector('footer');
    if (footer) footer.textContent = t('footer');
    // Gate
    const gateH2 = document.querySelector('.gate h2');
    if (gateH2) gateH2.textContent = t('gateTitle');
    const gateP = document.querySelector('.gate p');
    if (gateP) gateP.textContent = t('gateDesc');
    const signInBtn = document.querySelector('.gate .btn-primary');
    if (signInBtn) {
      const gIcon = signInBtn.querySelector('.google-icon');
      signInBtn.textContent = '';
      if (gIcon) signInBtn.appendChild(gIcon);
      signInBtn.appendChild(document.createTextNode(' ' + t('signIn')));
    }
  }

  // ============================================================
  // TABS
  // ============================================================
  window.switchTab = (tab) => {
    document.querySelectorAll('.tab').forEach((el, i) => {
      el.classList.toggle('active', (i === 0 && tab === 'select') || (i === 1 && tab === 'compare'));
    });
    document.getElementById('tab-select').classList.toggle('hidden', tab !== 'select');
    document.getElementById('tab-compare').classList.toggle('hidden', tab !== 'compare');
    if (tab === 'compare') renderCompareTable();
    applyStaticStrings();
  };

  // Init lang buttons
  document.getElementById('page-btn-en').classList.toggle('active', pageLang === 'en');
  document.getElementById('page-btn-zh').classList.toggle('active', pageLang === 'zh');
</script>

</body>
</html>
